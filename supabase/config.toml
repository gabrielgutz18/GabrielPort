# Public contact form: visitors have no Supabase session, so there is no JWT to
# verify. Abuse protection is the origin allowlist and input validation inside
# the function, not auth.
[functions.send-contact-email]
verify_jwt = false

# Public feedback form: same reason, no visitor JWT. Abuse protection is the
# reCAPTCHA token the function verifies with Google before inserting.
[functions.submit-feedback]
verify_jwt = false
